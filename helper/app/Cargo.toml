# helper/app/Cargo.toml: PadLink Helper, the Windows tray app that injects phone input over USB.
[package]
name = "padlink-helper"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
padlink-protocol = { path = "../protocol" }
getrandom = "0.3"
socket2 = "0.5"

[target.'cfg(windows)'.dependencies]
ipconfig = "0.3"
tray-icon = "0.21"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Pointer",
    "Win32_UI_WindowsAndMessaging",
] }
