# helper/Cargo.toml: workspace for the PadLink Windows helper and its platform-independent protocol crate.
[workspace]
resolver = "2"
members = ["protocol", "app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[profile.release]
lto = true
codegen-units = 1
strip = true
