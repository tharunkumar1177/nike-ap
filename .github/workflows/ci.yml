# ci.yml: builds and tests the Android app and the Windows helper on work-branch pushes; optional all-OS protocol tests on main.
name: CI

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:
    inputs:
      all_os:
        description: "Also run the protocol crate tests on macOS and Linux (honored only on main)"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android app
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build, unit test, and lint
        run: gradle -p android assembleDebug assembleRelease testDebugUnitTest lintDebug --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: padlink-android
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: padlink-android-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: ignore

  helper:
    name: Windows helper
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: helper
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: helper

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build release
        run: cargo build --release

      - name: Package with adb
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri 'https://dl.google.com/android/repository/platform-tools-latest-windows.zip' -OutFile platform-tools.zip
          Expand-Archive platform-tools.zip -DestinationPath tools
          New-Item -ItemType Directory -Force -Path out/PadLinkHelper/platform-tools | Out-Null
          Copy-Item target/release/padlink-helper.exe out/PadLinkHelper/
          foreach ($f in 'adb.exe', 'AdbWinApi.dll', 'AdbWinUsbApi.dll', 'NOTICE.txt') {
            Copy-Item "tools/platform-tools/$f" out/PadLinkHelper/platform-tools/
          }
          Compress-Archive -Path out/PadLinkHelper -DestinationPath out/PadLinkHelper-windows.zip

      - name: Upload helper zip
        uses: actions/upload-artifact@v4
        with:
          name: padlink-helper-windows
          path: helper/out/PadLinkHelper-windows.zip
          if-no-files-found: error

  protocol-all-os:
    name: Protocol crate (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' && inputs.all_os && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: helper
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test protocol crate
        run: cargo test -p padlink-protocol
