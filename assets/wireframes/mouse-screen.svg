<?xml version="1.0" encoding="UTF-8"?>
<!-- assets/wireframes/mouse-screen.svg: Mouse screen wireframe (portrait, Galaxy S Ultra proportions). -->
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="780" viewBox="0 0 360 780" font-family="sans-serif">
  <rect x="0" y="0" width="360" height="780" fill="#f6f8fb"/>
  <!-- App bar -->
  <text x="16" y="52" font-size="22" fill="#1b1b1f">&#9776;</text>
  <text x="52" y="46" font-size="20" fill="#1b1b1f">Mouse / Keyboard</text>
  <text x="52" y="68" font-size="13" fill="#44474e">Target name  connected  &#9662;</text>
  <rect x="262" y="34" width="28" height="22" rx="4" fill="none" stroke="#44474e"/>
  <text x="268" y="50" font-size="11" fill="#44474e">pen</text>
  <circle cx="320" cy="45" r="11" fill="none" stroke="#44474e"/>
  <text x="314" y="50" font-size="12" fill="#44474e">&#9881;</text>
  <!-- Connecting progress -->
  <rect x="4" y="80" width="352" height="4" rx="2" fill="#cfe5ff"/>
  <!-- Trackpad -->
  <rect x="4" y="90" width="352" height="590" rx="18" fill="#004b70"/>
  <text x="160" y="390" font-size="28" fill="#cfe5ff">&#128433;</text>
  <text x="120" y="420" font-size="12" fill="#cfe5ff">finger: trackpad, S Pen: tablet</text>
  <!-- Scroll strip -->
  <text x="325" y="118" font-size="14" fill="#cfe5ff">&#8963;</text>
  <line x1="330" y1="130" x2="330" y2="640" stroke="#cfe5ff" stroke-width="1"/>
  <text x="325" y="664" font-size="14" fill="#cfe5ff">&#8964;</text>
  <!-- Buttons -->
  <rect x="4" y="688" width="172" height="80" rx="18" fill="#3a7ca5"/>
  <rect x="184" y="688" width="172" height="80" rx="18" fill="#3a7ca5"/>
  <text x="76" y="733" font-size="13" fill="#ffffff">Left</text>
  <text x="252" y="733" font-size="13" fill="#ffffff">Right</text>
</svg>
