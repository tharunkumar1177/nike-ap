<?xml version="1.0" encoding="UTF-8"?>
<!-- assets/wireframes/settings-mouse.svg: settings sheet fully expanded on the Mouse tab, all values at their defaults (portrait, light theme). -->
<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="Roboto, 'Segoe UI', Arial, sans-serif">
  <defs>
    <path id="ic-wifi" d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/>
    <path id="ic-signal" d="M2 22h20V2z"/>
    <path id="ic-battery" d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/>
  </defs>

  <rect id="background" x="0" y="0" width="390" height="844" fill="#F6F8FB"/>
  <rect id="scrim" x="0" y="0" width="390" height="844" fill="#000000" fill-opacity="0.32"/>

  <g id="sheet">
    <path d="M0 52A28 28 0 0 1 28 24H362A28 28 0 0 1 390 52V844H0Z" fill="#F7F2FA"/>
    <rect id="drag-handle" x="179" y="46" width="32" height="4" rx="2" fill="#49454F" fill-opacity="0.4"/>

    <g id="tab-row" font-size="14" font-weight="500" text-anchor="middle">
      <rect x="0" y="72" width="390" height="48" fill="#F6F8FB"/>
      <rect x="0" y="119" width="390" height="1" fill="#CAC4D0"/>
      <rect x="0" y="118" width="97.5" height="2" fill="#00658F"/>
      <text x="48.75" y="100.8" fill="#00658F">Mouse</text>
      <text x="146.25" y="100.8" fill="#49454F">Pen</text>
      <text x="243.75" y="100.8" fill="#49454F">Connection</text>
      <text x="341.25" y="100.8" fill="#49454F">Display</text>
    </g>

    <g id="content" fill="#1D1B20">
      <g id="pointer-speed">
        <text x="20" y="149.5" font-size="16">Pointer speed</text>
        <text x="370" y="146.8" font-size="14" text-anchor="end">50</text>
        <path d="M28 172H185A2 2 0 0 1 187 174V186A2 2 0 0 1 185 188H28A8 8 0 0 1 20 180A8 8 0 0 1 28 172Z" fill="#00658F"/>
        <path d="M205 172H362A8 8 0 0 1 362 188H205A2 2 0 0 1 203 186V174A2 2 0 0 1 205 172Z" fill="#E8DEF8"/>
        <circle cx="362" cy="180" r="2" fill="#00658F"/>
        <rect x="193" y="158" width="4" height="44" rx="2" fill="#00658F"/>
      </g>

      <g id="scroll-speed">
        <text x="20" y="231.5" font-size="16">Scroll speed</text>
        <text x="370" y="228.8" font-size="14" text-anchor="end">50</text>
        <path d="M28 254H185A2 2 0 0 1 187 256V268A2 2 0 0 1 185 270H28A8 8 0 0 1 20 262A8 8 0 0 1 28 254Z" fill="#00658F"/>
        <path d="M205 254H362A8 8 0 0 1 362 270H205A2 2 0 0 1 203 268V256A2 2 0 0 1 205 254Z" fill="#E8DEF8"/>
        <circle cx="362" cy="262" r="2" fill="#00658F"/>
        <rect x="193" y="240" width="4" height="44" rx="2" fill="#00658F"/>
      </g>

      <g id="invert-scroll">
        <text x="20" y="325.5" font-size="16">Invert scroll</text>
        <rect x="318" y="304" width="52" height="32" rx="16" fill="#E6E0E9"/>
        <rect x="319" y="305" width="50" height="30" rx="15" fill="none" stroke="#79747E" stroke-width="2"/>
        <circle cx="334" cy="320" r="8" fill="#79747E"/>
      </g>

      <g id="tap-to-click">
        <text x="20" y="383.5" font-size="16">Tap to click</text>
        <rect x="318" y="362" width="52" height="32" rx="16" fill="#00658F"/>
        <circle cx="354" cy="378" r="12" fill="#FFFFFF"/>
      </g>

      <rect id="divider" x="20" y="412" width="350" height="1" fill="#CAC4D0"/>

      <g id="scroll-bar">
        <text x="20" y="440.5" font-size="16">Scroll bar</text>
        <g font-size="14" font-weight="500" text-anchor="middle">
          <rect x="20.5" y="459.5" width="56" height="31" rx="7.5" fill="none" stroke="#CAC4D0"/>
          <text x="48.5" y="479.8" fill="#49454F">Left</text>
          <rect x="85" y="459" width="65" height="32" rx="8" fill="#E8DEF8"/>
          <text x="117.5" y="479.8" fill="#1D192B">Right</text>
        </g>
      </g>

      <g id="mouse-buttons-position">
        <text x="20" y="526.5" font-size="16">Mouse buttons</text>
        <g font-size="14" font-weight="500" text-anchor="middle">
          <rect x="20.5" y="545.5" width="55" height="31" rx="7.5" fill="none" stroke="#CAC4D0"/>
          <text x="48" y="565.8" fill="#49454F">Top</text>
          <rect x="84" y="545" width="78" height="32" rx="8" fill="#E8DEF8"/>
          <text x="123" y="565.8" fill="#1D192B">Bottom</text>
        </g>
      </g>

      <g id="visible-buttons">
        <text x="20" y="612.5" font-size="16">Visible buttons</text>
        <g font-size="14" font-weight="500" text-anchor="middle">
          <rect x="20" y="631" width="57" height="32" rx="8" fill="#E8DEF8"/>
          <text x="48.5" y="651.8" fill="#1D192B">Left</text>
          <rect x="85.5" y="631.5" width="74" height="31" rx="7.5" fill="none" stroke="#CAC4D0"/>
          <text x="122.5" y="651.8" fill="#49454F">Middle</text>
          <rect x="168" y="631" width="65" height="32" rx="8" fill="#E8DEF8"/>
          <text x="200.5" y="651.8" fill="#1D192B">Right</text>
        </g>
      </g>
    </g>
  </g>

  <g id="status-bar" fill="#1D1B20">
    <text x="16" y="16.8" font-size="14">12:30</text>
    <use href="#ic-wifi" transform="translate(318 4) scale(0.6667)"/>
    <use href="#ic-signal" transform="translate(338 4) scale(0.6667)"/>
    <use href="#ic-battery" transform="translate(358 4) scale(0.6667)"/>
  </g>

  <g id="nav-bar">
    <rect x="141" y="830" width="108" height="4" rx="2" fill="#1D1B20"/>
  </g>
</svg>
