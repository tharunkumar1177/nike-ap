  <!-- Progress slot y 88..92 stays empty while connected. -->

  <g id="trackpad">
    <rect x="4" y="96" width="330" height="632" rx="18" fill="#004B70"/>
    <use href="#ic-mouse" transform="translate(147 378) scale(1.8333)" fill="#CFE5FF"/>
    <text x="169" y="442.1" font-size="12" fill="#CFE5FF" text-anchor="middle">Finger: trackpad &#183; S Pen: tablet</text>
  </g>

  <g id="scroll-strip">
