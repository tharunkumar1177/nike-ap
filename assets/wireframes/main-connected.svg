    <rect x="199" y="736" width="187" height="80" rx="18" fill="#3A7CA5"/>
    <text x="292.5" y="780.8" font-size="14" font-weight="500" fill="#FFFFFF" text-anchor="middle">Right</text>
  </g>

  <g id="status-bar" fill="#1D1B20">
