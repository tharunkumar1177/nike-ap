  <rect id="background" x="0" y="0" width="390" height="844" fill="#F6F8FB"/>

  <g id="top-app-bar">
    <text x="16" y="51.5" font-size="22" fill="#1D1B20">Mouse</text>
    <g id="transport-picker">
